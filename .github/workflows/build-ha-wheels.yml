name: Build HA Wheels for armv7

on:
  push:
    paths:
      - 'build-config.yaml'
  workflow_dispatch:
    inputs:
      homeassistant_version:
        description: 'HA version to build wheels for (overrides build-config.yaml if set)'
        required: false

env:
  TARGET_PLATFORM: linux/arm/v7
  WHEEL_PLATFORM_TAG: linux_armv7l   # glibc tag, matches DietPi (Debian-based)

jobs:
  # ---------------------------------------------------------------
  # 1. Read config + fetch the exact requirements file for that HA version
  # ---------------------------------------------------------------
  config:
    runs-on: ubuntu-latest
    outputs:
      ha_version: ${{ steps.set.outputs.ha_version }}
      py_version: ${{ steps.set.outputs.py_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install yq
        run: sudo snap install yq

      - name: Resolve target versions
        id: set
        run: |
          if [ -n "${{ github.event.inputs.homeassistant_version }}" ]; then
            HA_VERSION="${{ github.event.inputs.homeassistant_version }}"
          else
            HA_VERSION=$(yq '.homeassistant_version' build-config.yaml)
          fi
          PY_VERSION=$(yq '.python_version' build-config.yaml)
          echo "ha_version=$HA_VERSION" >> "$GITHUB_OUTPUT"
          echo "py_version=$PY_VERSION" >> "$GITHUB_OUTPUT"

      - name: Fetch requirements files for this HA version
        run: |
          # requirements_all.txt references both requirements.txt (-r) and
          # homeassistant/package_constraints.txt (-c) by relative path,
          # matching HA's actual repo layout, so we recreate that structure.
          curl -fsSL -o requirements.txt \
            "https://raw.githubusercontent.com/home-assistant/core/${{ steps.set.outputs.ha_version }}/requirements.txt"
          curl -fsSL -o requirements_all.txt \
            "https://raw.githubusercontent.com/home-assistant/core/${{ steps.set.outputs.ha_version }}/requirements_all.txt"
          mkdir -p homeassistant
          curl -fsSL -o homeassistant/package_constraints.txt \
            "https://raw.githubusercontent.com/home-assistant/core/${{ steps.set.outputs.ha_version }}/homeassistant/package_constraints.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: requirements
          path: |
            requirements.txt
            requirements_all.txt
            homeassistant/package_constraints.txt

  # ---------------------------------------------------------------
  # 2. Detect which packages have NO existing armv7/cp314 wheel
  # ---------------------------------------------------------------
  detect:
    needs: config
    runs-on: ubuntu-latest
    outputs:
      to_build: ${{ steps.parse.outputs.to_build }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: requirements

      - name: Build combined package list
        run: |
          grep -vE '^(#|-r |-c |\s*$)' requirements.txt requirements_all.txt \
            | sed 's/^[^:]*://' | sort -u > combined_requirements.txt

      - name: Check PyPI metadata for a matching armv7/cp314 wheel (no downloads)
        id: parse
        run: |
          set +e   # individual grep/curl misses are expected here, not fatal
          : > to_build.txt
          : > needs_review.txt
          while IFS= read -r req; do
            name=$(echo "$req" | grep -oE '^[A-Za-z0-9_.-]+')
            version=$(echo "$req" | grep -oP '(?<===)[0-9][A-Za-z0-9_.\-]*' | head -1)
            if [ -z "$name" ] || [ -z "$version" ]; then
              echo "$req" >> needs_review.txt
              continue
            fi
            json=$(curl -fsSL "https://pypi.org/pypi/${name}/${version}/json" 2>/dev/null)
            if [ -z "$json" ]; then
              echo "$name==$version" >> needs_review.txt
              continue
            fi
            match=$(echo "$json" | jq -r '.urls[].filename' 2>/dev/null \
              | grep -E 'py[23]?(\.py3)?-none-any\.whl$|(armv7l).*cp314|cp314.*(armv7l)|armv7l.*cp3[0-9]+-abi3|cp3[0-9]+-abi3.*armv7l')
            if [ -z "$match" ]; then
              echo "$name==$version" >> to_build.txt
            fi
          done < combined_requirements.txt
          set -e
          echo "Packages needing a build:"
          cat to_build.txt
          echo "Skipped/unresolved — check manually:"
          cat needs_review.txt
          PKGS_JSON=$(jq -R -s -c 'split("\n") | map(select(length > 0))' to_build.txt)
          echo "to_build=$PKGS_JSON" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: needs-review-list
          path: needs_review.txt

      - uses: actions/upload-artifact@v4
        with:
          name: to-build-list
          path: to_build.txt

  # ---------------------------------------------------------------
  # 3. Build a wheel for each package that needs one (matrix)
  # ---------------------------------------------------------------
  build:
    needs: [config, detect]
    if: needs.detect.outputs.to_build != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.detect.outputs.to_build) }}
    steps:
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build wheel for ${{ matrix.package }}
        uses: nick-fields/retry@v3
        continue-on-error: true
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 15
          command: |
            mkdir -p output
            docker run --rm --platform ${{ env.TARGET_PLATFORM }} \
              -v "$PWD/output":/output \
              python:${{ needs.config.outputs.py_version }}-bookworm \
              bash -c "
                apt-get update && apt-get install -y build-essential gfortran libopenblas-dev \
                  pkg-config libavformat-dev libavcodec-dev libavdevice-dev libavutil-dev \
                  libavfilter-dev libswscale-dev libswresample-dev &&
                pip install --upgrade pip wheel &&
                pip wheel '${{ matrix.package }}' -w /output --no-deps
              "

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.package }}
          path: output/*.whl

  # ---------------------------------------------------------------
  # 4. Collect all built wheels and publish as a GitHub Release
  # ---------------------------------------------------------------
  publish:
    needs: [config, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      - name: List built wheels
        run: ls -la dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ha-wheels-${{ needs.config.outputs.ha_version }}
          name: HA armv7 wheels — ${{ needs.config.outputs.ha_version }}
          files: dist/*.whl
          fail_on_unmatched_files: false