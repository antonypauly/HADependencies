name: Reset HA Wheels Test Release

on:
  workflow_dispatch: {}

jobs:
  reset-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ha-wheels-test --cleanup-tag -y \
            --repo ${{ github.repository }} \
            || echo "No ha-wheels-test release found — nothing to clean up."
